<style>
    .countdown {
        display: flex;
        gap: 1rem;
        flex-wrap: wrap;
        justify-content: center;
    }

    .countdown-element {
        text-align: center;
        font-size: 2rem;
        background-color: white;
        border-radius: 0.5rem;
        padding: 1.25rem;
        box-shadow: 0 0.25rem 0.5rem rgba(0, 0, 0, 0.1);
        min-width: 8rem;
    }

    .countdown-element div {
        font-size: 0.6em;
        color: #000000;
    }

    .countdown-element span {
        font-size: 1em;
        font-weight: bold;
    }

    .hidden {
        display: none;
    }

    @media (max-width: 768px) {
        .countdown {
            gap: 0.5rem;
            flex-direction: row;
            flex-wrap: wrap;
            justify-content: center;
        }

        .countdown-element {
            width: calc(50% - 1rem);
            font-size: 1.5rem;
        }

        .countdown-element span {
            font-size: 2em;
        }

        .countdown-element div {
            font-size: 0.5em;
        }
    }

    @media (max-width: 500px) {
        .countdown-element {
            width: calc(50% - 0.5rem);
            font-size: 2rem;
        }

        .countdown-element span {
            font-size: 2.5em;
        }

        .countdown-element div {
            font-size: 0.4em;
        }
    }

    @media (max-width: 20rem) {
        .countdown, .text {
            display: none;
        }
    }
</style>

<h1 style="font-size:3rem;font-family:Rockwell, Roboto, sans-serif; text-align:center" class="text hidden">
    <span class="countdown-prefix"></span><a class="event-link" href="#"></a><span class="countdown-suffix"></span>
</h1>
<div class="countdown hidden">
    <div class="countdown-element">
        <span id="days">00</span>
        <div>Days</div>
    </div>
    <div class="countdown-element">
        <span id="hours">00</span>
        <div>Hours</div>
    </div>
    <div class="countdown-element">
        <span id="minutes">00</span>
        <div>Minutes</div>
    </div>
    <div class="countdown-element">
        <span id="seconds">00</span>
        <div>Seconds</div>
    </div>
</div>

<script>
    const countdowns = [
        {% assign now = site.time | date: '%s' %}
        {% assign sorted_events = site.events | sort: 'start' %}
        {% assign current_events = "" | split: "" %}
        {% for event in sorted_events %}
        {% assign event_start = event.start | date: '%s' %}
        {% assign event_end = event.end | default: event.start | date: '%s' %}
        {% if event_end >= now %}
        {% assign current_events = current_events | push: event %}
        {% endif %}
        {% endfor %}
        {% for event in current_events %}
        { start: new Date("{{ event.start | date_to_xmlschema }}"), end: new Date("{{ event.end | default: event.start | date_to_xmlschema }}"), text: {{ event.title | jsonify }}, url: {{ event.url | relative_url | jsonify }} }{% if forloop.last %}{% else %},{% endif %}
        {% endfor %}
    ];

    function updateCountdown() {
        const now = new Date().getTime();
        let activeCountdown = null;
        let closestCountdown = null;

        for (const countdown of countdowns) {
            const start = countdown.start.getTime();
            const end = countdown.end.getTime();

            if (start <= now && end >= now) {
                if (!activeCountdown || end < activeCountdown.end.getTime()) {
                    activeCountdown = countdown;
                }
            } else if (start > now) {
                if (!closestCountdown || start < closestCountdown.start.getTime()) {
                    closestCountdown = countdown;
                }
            }
        }

        const selectedCountdown = activeCountdown || closestCountdown;
        const text = document.querySelector(".text");
        const countdownPrefix = document.querySelector(".countdown-prefix");
        const eventLink = document.querySelector(".event-link");
        const countdownSuffix = document.querySelector(".countdown-suffix");
        const countdownElement = document.querySelector(".countdown");

        if (selectedCountdown) {
            countdownPrefix.textContent = activeCountdown ? "Happening now: " : "Countdown to the ";
            eventLink.textContent = activeCountdown
                ? activeCountdown.text
                : closestCountdown.text;
            countdownSuffix.textContent = activeCountdown ? "" : "!";
            eventLink.href = selectedCountdown.url;
            text.classList.remove('hidden');
            countdownElement.classList.toggle('hidden', Boolean(activeCountdown));

            if (activeCountdown) {
                return;
            }

            const timeDifference = closestCountdown.start.getTime() - now;

            const days = Math.floor(timeDifference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((timeDifference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((timeDifference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((timeDifference % (1000 * 60)) / 1000);

            document.getElementById("days").textContent = String(days).padStart(2, '0');
            document.getElementById("hours").textContent = String(hours).padStart(2, '0');
            document.getElementById("minutes").textContent = String(minutes).padStart(2, '0');
            document.getElementById("seconds").textContent = String(seconds).padStart(2, '0');
        } else {
            text.classList.add('hidden');
            eventLink.removeAttribute('href');
            countdownElement.classList.add('hidden');
        }
    }

    setInterval(updateCountdown, 1000);

    updateCountdown();
</script>
